<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">

    <!-- Brand -->
    <a class="navbar-brand" href="{% url 'dashboard' %}">
      <i class="fas fa-shipping-fast me-2"></i>Encomiendas
    </a>

    <!-- Toggle móvil -->
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarMain"
            aria-controls="navbarMain" aria-expanded="false" aria-label="Menú">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMain">

      {% if user.is_authenticated %}
      <!-- Links principales -->
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'encomienda_lista' %}">Encomiendas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'encomienda_crear' %}">Nueva</a>
        </li>
      </ul>

      <!-- Usuario logueado -->
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-text">
          <i class="fas fa-user me-1"></i>{{ user.username }}
        </span>
        <form method="POST" action="{% url 'logout' %}" class="d-inline m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-light btn-sm">
            <i class="fas fa-sign-out-alt me-1"></i>Salir
          </button>
        </form>
      </div>

      {% else %}
      <div class="ms-auto">
        <a href="{% url 'login' %}" class="btn btn-outline-light">
          <i class="fas fa-sign-in-alt me-1"></i>Iniciar sesión
        </a>
      </div>
      {% endif %}

    </div>
  </div>
</nav>
