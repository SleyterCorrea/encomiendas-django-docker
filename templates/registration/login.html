<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Sistema de Encomiendas</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    body {
      background-color: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }
    .login-header {
      background-color: #0d6efd;
      color: white;
      border-radius: 12px 12px 0 0;
      padding: 2rem;
      text-align: center;
    }
    .login-header i { font-size: 2.5rem; margin-bottom: 0.5rem; display: block; }
    .login-body { padding: 2rem; background: white; border-radius: 0 0 12px 12px; }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <i class="fas fa-shipping-fast"></i>
      <h1 class="h4 mb-0 fw-bold">Sistema de Encomiendas</h1>
      <p class="mb-0 mt-1 opacity-75 small">Ingresa tus credenciales para continuar</p>
    </div>

    <!-- Body -->
    <div class="login-body">

      {% if form.errors %}
      <div class="alert alert-danger">
        <i class="fas fa-exclamation-triangle me-1"></i>
        Usuario o contraseña incorrectos. Inténtalo nuevamente.
      </div>
      {% endif %}

      {% if messages %}
      {% for message in messages %}
      <div class="alert alert-info">{{ message }}</div>
      {% endfor %}
      {% endif %}

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="mb-3">
          <label for="{{ form.username.id_for_label }}" class="form-label fw-semibold">
            <i class="fas fa-user me-1"></i>Usuario
          </label>
          <input
            type="text"
            name="{{ form.username.html_name }}"
            id="{{ form.username.id_for_label }}"
            class="form-control"
            placeholder="Nombre de usuario"
            autofocus
            required
          >
        </div>

        <div class="mb-4">
          <label for="{{ form.password.id_for_label }}" class="form-label fw-semibold">
            <i class="fas fa-lock me-1"></i>Contraseña
          </label>
          <input
            type="password"
            name="{{ form.password.html_name }}"
            id="{{ form.password.id_for_label }}"
            class="form-control"
            placeholder="••••••••"
            required
          >
        </div>

        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button type="submit" class="btn btn-primary w-100 fw-semibold">
          <i class="fas fa-sign-in-alt me-2"></i>Iniciar sesión
        </button>

      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
